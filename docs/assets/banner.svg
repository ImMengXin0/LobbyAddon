      <stop stop-color="#2C6682"/>
      <stop offset="1" stop-color="#695BB5"/>
    </linearGradient>
    <linearGradient id="nameText" x2="1">
      <stop stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#B8F6FA"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="410" rx="24" fill="#0B111C"/>
  <rect x="1" y="1" width="1398" height="408" rx="23" stroke="#2A466B" stroke-width="2"/>
  <rect x="20" y="20" width="1360" height="370" rx="18" fill="#101B2D"/>
  <rect x="20" y="20" width="1360" height="370" rx="18" stroke="#172C4A" stroke-width="1"/>

  <g opacity="0.2" stroke="#365477" stroke-width="1">
