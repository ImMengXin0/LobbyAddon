  <text x="124" y="100" fill="#57E8F3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="7">MX / LOBBY STYLE TOOLKIT</text>
  <text x="120" y="174" fill="#F4F8FF" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">LobbyAddon</text>
  <text x="124" y="215" fill="#AFC3DF" font-family="Arial, Helvetica, sans-serif" font-size="24">Style every player. Control every name.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">
