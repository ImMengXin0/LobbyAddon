<svg width="1400" height="410" viewBox="0 0 1400 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LobbyAddon</title>
  <desc id="desc">Player style management for lobby servers: nicknames, prefixes, suffixes and chat colors on Spigot 1.8.8</desc>

  <defs>
